<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ونس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#FBF7F0;--sf:#fff;--ink:#1D1A2B;--mut:#6E6A7C;--line:#EAE3D6;--pri:#0F5C4D;--on:#fff;--acc:#F6A04D;--like:#E0556F;--sh:0 10px 30px rgba(29,26,43,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121C;--sf:#1E1B2B;--ink:#F4F1EA;--mut:#A29EB3;--line:#2C2840;--pri:#3CC1A5;--on:#0B2A24;--like:#F27A91;--sh:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#14121C;--sf:#1E1B2B;--ink:#F4F1EA;--mut:#A29EB3;--line:#2C2840;--pri:#3CC1A5;--on:#0B2A24;--like:#F27A91;--sh:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 'Cairo',system-ui,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .15s,opacity .2s}button:active{transform:scale(.94)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.anim{animation:in .35s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.scr{padding:28px 22px;min-height:100dvh}
.hero{text-align:center;padding-top:6vh}.lg{width:92px;height:92px;filter:drop-shadow(0 12px 18px rgba(15,92,77,.3));animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-14deg);opacity:0}}
.brand{font-size:48px;font-weight:800;line-height:1.1;margin:8px 0 0}.tagl{color:var(--mut);margin:4px 0 18px}
.btn{display:block;width:100%;padding:14px 22px;border-radius:99px;background:var(--pri);color:var(--on);font-weight:800;font-size:16px;text-align:center;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 35%,transparent);margin-top:14px}
.btn:disabled{opacity:.45;box-shadow:none}.btn.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.fld{width:100%;margin-top:10px;padding:13px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--sf)}.fld:focus{border-color:var(--pri);outline:0}
.lbl{font-weight:700;margin:14px 0 4px;font-size:14px}.msg{color:var(--like);font-size:13px;min-height:20px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chip{flex:none;padding:7px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--sf);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ck{display:flex;gap:10px;margin-top:12px;font-size:14px}.ck input{width:20px;height:20px;accent-color:var(--pri);margin-top:3px}
.lnk{color:var(--pri);font-weight:700;text-decoration:underline;font-size:inherit}
#app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px}.mini{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;color:var(--pri)}.mini svg{width:34px;height:34px}
.stage{position:relative;height:min(60dvh,520px);margin:4px 16px 0}
.card{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:var(--sf);box-shadow:var(--sh);touch-action:pan-y;user-select:none;cursor:grab;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.card.back{transform:scale(.93) translateY(14px);opacity:.7;pointer-events:none}
.av{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 25% 18%,hsl(var(--h) 75% 72%/.75),transparent 46%),radial-gradient(circle at 82% 72%,hsl(calc(var(--h) + 55) 70% 55%/.85),transparent 52%),linear-gradient(160deg,hsl(var(--h) 45% 30%),hsl(calc(var(--h) + 30) 50% 14%))}
.av b{font-size:190px;line-height:1;color:rgba(255,255,255,.2);margin-top:-70px}.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 60%)}
.vf{position:absolute;top:14px;right:14px;background:#fff;color:#0F5C4D;font-size:12px;font-weight:800;padding:3px 12px;border-radius:99px}
.more{position:absolute;top:10px;left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:20px}
.stamp{position:absolute;top:64px;opacity:0;font-weight:800;font-size:26px;padding:2px 18px;border:4px solid #fff;border-radius:14px;color:#fff;pointer-events:none}
.stamp.l{left:18px;background:var(--like);transform:rotate(-10deg)}.stamp.s{right:18px;background:#3B3850;transform:rotate(10deg)}
.info{position:absolute;bottom:0;width:100%;padding:20px;color:#fff}.info h2{margin:0;font-size:29px;line-height:1.2}.info p{margin:4px 0 0;font-size:14px}.info .loc{opacity:.85;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tags span{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:99px;padding:1px 12px;font-size:12px}
.acts{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:22px}
.rd{width:56px;height:56px;border-radius:50%;background:var(--sf);box-shadow:var(--sh);display:grid;place-items:center}.rd.sm{width:44px;height:44px}
.rd.big{width:70px;height:70px;background:linear-gradient(135deg,var(--like),#F28B6B);color:#fff}.rd.big svg{width:30px;height:30px;fill:#fff}
.note{text-align:center;color:var(--mut);font-size:13px;margin:14px 16px 0}.pad{padding:6px 18px}h2.t{font-size:24px;margin:8px 0 10px}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-top:10px;width:100%;text-align:start}
.dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(160deg,hsl(var(--h) 55% 45%),hsl(calc(var(--h) + 40) 55% 28%));flex:none;position:relative;overflow:hidden}
.row .g{flex:1;min-width:0}.row small{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:50px 20px}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.plus{background:linear-gradient(135deg,#0F5C4D,#1F8A74 60%,#F6A04D);color:#fff;border-radius:22px;padding:18px;margin-top:12px}.plus p{margin:2px 0;font-size:14px}
.plus button{margin-top:10px;background:#fff;color:#0F5C4D;font-weight:800;padding:8px 20px;border-radius:99px}
nav{position:fixed;bottom:0;inset-inline:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:480px}nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;color:var(--mut);padding:6px 0}
nav button[aria-current="page"]{color:var(--pri);font-weight:800}
#chat{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);animation:slide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(-100%)}}.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:8px 14px;border-radius:18px;background:var(--sf);border:1px solid var(--line);align-self:flex-end;animation:in .25s;word-break:break-word}
.m.me{align-self:flex-start;background:var(--pri);color:var(--on);border:0}.m small{display:block;font-size:10px;opacity:.6}
.cf{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cf input{flex:1;padding:11px 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--sf)}.cf button{width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center}
#match{position:fixed;inset:0;z-index:20;background:rgba(15,92,77,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fade .3s}
@keyframes fade{from{opacity:0}}#match h1{font-size:46px;margin:14px 0 4px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.pair{display:flex}.pair .dot{width:96px;height:96px;border:4px solid #fff;font-size:40px;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}.pair .dot+.dot{margin-inline-end:-18px}
dialog{border:0;border-radius:26px;max-width:440px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);padding:22px;max-height:88dvh;animation:in .3s}
dialog::backdrop{background:rgba(0,0,0,.55)}dialog h2{margin:0 0 6px}dialog li{margin:4px 0;color:var(--mut)}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 20px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;animation:in .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lg" viewBox="0 0 64 64"><path d="M6 24C6 15 13 8 22 8h14c9 0 16 7 16 16s-7 16-16 16H26l-10 8v-9C10 37 6 31 6 24z" fill="#0F5C4D"/><path d="M26 34c0-9 7-16 16-16h2c9 0 16 7 16 16 0 7-4 13-10 15v9l-10-8h-2c-8 0-12-7-12-16z" fill="#F6A04D"/><path d="M40 33.5c-1.8-3-6-1.8-6 1.3 0 2.6 3.6 5 6 7 2.4-2 6-4.4 6-7 0-3.1-4.2-4.3-6-1.3z" fill="#fff"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.3-8 11-8 11z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-6 15-6 16 0"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</defs></svg>

<div class="wrap">
<section id="load" class="scr hero"><svg class="lg"><use href="#lg"/></svg><p class="tagl">جاري التحميل…</p></section>

<section id="auth" class="scr" hidden>
<div class="hero"><svg class="lg"><use href="#lg"/></svg><h1 class="brand">ونس</h1><p class="tagl">تعارف بجد، بهدوء وأمان</p></div>
<div class="chips" style="justify-content:center"><button class="chip on" data-mode="in">دخول</button><button class="chip" data-mode="up">حساب جديد</button></div>
<input class="fld" id="em" type="email" placeholder="الإيميل" autocomplete="email" dir="ltr">
<input class="fld" id="pw" type="password" placeholder="كلمة السر (8 حروف على الأقل)" autocomplete="current-password" dir="ltr">
<p class="msg" id="am"></p>
<button class="btn" id="ab" style="margin-top:4px">دخول</button>
</section>

<section id="setup" class="scr" hidden>
<h1 style="margin:0">عرّفنا بيك</h1><p style="color:var(--mut);margin:0">معلومات بسيطة وتبدأ.</p>
<input class="fld" id="nm" placeholder="اسمك الأول" maxlength="20">
<div class="lbl">تاريخ ميلادك</div><input class="fld" id="bd" type="date" style="margin-top:0">
<div class="lbl">أنا</div><div class="chips" id="gd"></div>
<div class="lbl">بدور على</div><div class="chips" id="sk"></div>
<select class="fld" id="gv"></select>
<div class="lbl">الغرض</div><div class="chips" id="it"></div>
<input class="fld" id="jb" placeholder="شغلك (اختياري)" maxlength="40">
<textarea class="fld" id="bio" placeholder="نبذة عنك (اختياري)" maxlength="300" rows="3"></textarea>
<div class="lbl">صورة (اختياري)</div><input type="file" id="pf" accept="image/jpeg,image/png,image/webp">
<label class="ck"><input type="checkbox" id="c1"> عمري 18 سنة أو أكتر</label>
<label class="ck"><input type="checkbox" id="c2"> قرأت <button class="lnk" data-a="policy" type="button">سياسة الخصوصية</button> وموافق</label>
<p class="msg" id="sm"></p><button class="btn" id="go" style="margin-top:4px">يلا نبدأ</button>
</section>

<section id="app" hidden>
<div class="top"><div class="mini"><svg><use href="#lg"/></svg>ونس</div></div>
<main id="view" aria-live="polite"></main>
<nav aria-label="التنقل"><div>
<button data-tab="d"><svg class="i"><use href="#heart"/></svg>اكتشف</button>
<button data-tab="c"><svg class="i"><use href="#chat"/></svg>الرسايل</button>
<button data-tab="p"><svg class="i"><use href="#user"/></svg>أنا</button></div></nav>
</section>
</div>
<div id="chat" hidden></div><div id="match" hidden></div><dialog id="dlg"></dialog>

<script>
/* إعدادات المشروع: الـ publishable key آمن يتحط في المتصفح (الحماية عن طريق RLS) */
const SB_URL="https://lblpukangqolatvcehbj.supabase.co";
const SB_KEY="sb_publishable_PR0_nENz4pbzxpdfEq-ODw_vDIsEu4x";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const GOV=["القاهرة","الجيزة","الإسكندرية","الدقهلية","الشرقية","الغربية","المنوفية","القليوبية","أسيوط","سوهاج","المنيا","الفيوم","بورسعيد","السويس","الإسماعيلية","دمياط","كفر الشيخ","البحيرة","بني سويف","قنا","الأقصر","أسوان"];
const INT={marriage:"زواج",serious:"علاقة جادة",friendship:"صداقة"},GEN={male:"ذكر",female:"أنثى"};
let user=null,me=null,Q=[],seenIds=new Set(),done=false,loading=false,gov="الكل",tab="d",M=[],cm=null,chn=null,mode="in",sel={gd:"female",sk:"male",it:"marriage"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue=id=>[...id].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`,dlg=$("#dlg");
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)};
const open=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
const show=v=>["load","auth","setup","app"].forEach(x=>$("#"+x).hidden=x!==v);
const urls={};const url=p=>urls[p]||(urls[p]=sb.storage.from("photos").createSignedUrl(p,3600).then(r=>r.data?.signedUrl));
function hydrate(){$$("[data-ph]").forEach(el=>{const p=el.dataset.ph;if(p)url(p).then(u=>{if(u)el.style.backgroundImage=`url("${u}")`})})}
const av=(o,big)=>`<div class="${big?"av":"dot"}" style="--h:${hue(o.id||o.user_id)}">${big?"":esc(o.name[0])}${big?`<b>${esc(o.name[0])}</b>`:""}<div class="ph" data-ph="${esc((o.photos||[])[0]||"")}"></div></div>`;

/* ---------- auth / routing ---------- */
async function route(){
const {data:{session}}=await sb.auth.getSession();user=session?.user||null;
if(!user){show("auth");return}
const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();me=data;
if(!me){show("setup");return}
if(me.is_banned){show("auth");$("#am").textContent="الحساب موقوف.";await sb.auth.signOut();return}
show("app");Q=[];seenIds.clear();done=false;draw();fill()}
$$("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));$("#ab").textContent=mode==="in"?"دخول":"إنشاء حساب";$("#pw").autocomplete=mode==="in"?"current-password":"new-password"});
$("#ab").onclick=async()=>{const email=$("#em").value.trim(),password=$("#pw").value,m=$("#am");m.textContent="";
if(!email||password.length<8){m.textContent="اكتب إيميل وكلمة سر 8 حروف على الأقل";return}
$("#ab").disabled=true;
const r=mode==="in"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
$("#ab").disabled=false;
if(r.error){m.textContent=r.error.message.includes("Invalid login")?"الإيميل أو كلمة السر غلط":r.error.message.includes("already")?"الإيميل ده مسجل قبل كده":"حصلت مشكلة: "+r.error.message;return}
if(mode==="up"&&!r.data.session){m.style.color="var(--pri)";m.textContent="بعتنالك إيميل تأكيد، افتحه وارجع سجّل دخول.";return}
route()};
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")route()});

/* ---------- setup ---------- */
const chipsFor=(id,obj)=>{$("#"+id).innerHTML=Object.entries(obj).map(([k,v])=>`<button type="button" class="chip${sel[id]===k?" on":""}" data-sel="${id}:${k}">${v}</button>`).join("")};
chipsFor("gd",GEN);chipsFor("sk",GEN);chipsFor("it",INT);$("#gv").innerHTML=GOV.map(g=>`<option>${g}</option>`).join("");
$("#go").onclick=async()=>{const m=$("#sm");m.textContent="";
const name=$("#nm").value.trim(),bd=$("#bd").value;
if(name.length<2){m.textContent="اكتب اسمك";return}
if(!bd){m.textContent="اكتب تاريخ ميلادك";return}
if((Date.now()-new Date(bd))/31557600000<18){m.textContent="لازم يكون عمرك 18 سنة أو أكتر";return}
if(!$("#c1").checked||!$("#c2").checked){m.textContent="وافق على الشروط";return}
$("#go").disabled=true;let photos=[];const f=$("#pf").files[0];
if(f){if(f.size>5e6){m.textContent="الصورة أكبر من 5 ميجا";$("#go").disabled=false;return}
const path=`${user.id}/${Date.now()}.${f.type.split("/")[1]}`;const up=await sb.storage.from("photos").upload(path,f,{contentType:f.type});
if(up.error){m.textContent="تعذر رفع الصورة";$("#go").disabled=false;return}photos=[path]}
const {error}=await sb.from("profiles").insert({id:user.id,name,birth_date:bd,gender:sel.gd,seeking:sel.sk,gov:$("#gv").value,intent:sel.it,job:$("#jb").value.trim()||null,bio:$("#bio").value.trim()||null,photos});
$("#go").disabled=false;if(error){m.textContent="حصلت مشكلة في الحفظ: "+error.message;return}route()};

/* ---------- discover ---------- */
async function fill(){if(loading||done||Q.length>=3)return;loading=true;
const {data,error}=await sb.rpc("get_discover",{p_gov:gov==="الكل"?null:gov,p_limit:10});loading=false;
if(error){toast("تعذر تحميل الملفات");return}
const fresh=(data||[]).filter(p=>!seenIds.has(p.id));fresh.forEach(p=>seenIds.add(p.id));Q.push(...fresh);if(!fresh.length)done=true;
if(tab==="d")draw(1)}
const card=(p,top)=>`<article class="card${top?"":" back"}" ${top?'id="top"':""} aria-label="${esc(p.name)}، ${p.age}">${av(p,1)}<div class="shade"></div>${p.is_verified?'<span class="vf">✓ موثق</span>':""}${top?`<button class="more" data-a="rep" aria-label="إبلاغ أو حظر">⋯</button><span class="stamp l" id="sl">أعجبني</span><span class="stamp s" id="ss">تخطي</span>`:""}<div class="info"><h2>${esc(p.name)}، ${p.age}</h2><p class="loc">${esc(p.gov)}${p.job?" · "+esc(p.job):""} · ${INT[p.intent]}</p>${p.bio?`<p>${esc(p.bio)}</p>`:""}<div class="tags">${(p.interests||[]).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div></article>`;
function vD(){const govs=["الكل",...GOV.slice(0,8)];
let h=`<div class="pad chips">${govs.map(g=>`<button class="chip${g===gov?" on":""}" data-gov="${g}">${g}</button>`).join("")}</div>`;
if(!Q.length)return h+`<div class="empty"><p>${loading?"جاري البحث…":"مفيش ملفات جديدة دلوقتي. جرب محافظة تانية أو ارجع بعدين."}</p></div>`;
return h+`<div class="stage">${Q[1]?card(Q[1],0):""}${card(Q[0],1)}</div><div class="acts"><button class="rd" data-a="skip" aria-label="تخطي">${ic("x")}</button><button class="rd big" data-a="like" aria-label="أعجبني">${ic("heart")}</button><button class="rd sm" data-a="super" aria-label="سوبر لايك">${ic("star")}</button></div><p class="note">25 إعجاب مجاني كل يوم</p>`}
function bind(){const c=$("#top");if(!c)return;let x0=null;
const rs=()=>{x0=null;c.style.transition="";c.style.transform="";$("#sl").style.opacity=$("#ss").style.opacity=0};
c.onpointerdown=e=>{if(e.target.closest(".more"))return;x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition="none"};
c.onpointermove=e=>{if(x0===null)return;const dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;$("#sl").style.opacity=Math.min(1,Math.max(0,dx/90));$("#ss").style.opacity=Math.min(1,Math.max(0,-dx/90))};
c.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0;c.style.transition="";if(dx>90){x0=null;fly("like")}else if(dx<-90){x0=null;fly("skip")}else rs()};c.onpointercancel=rs}
function fly(a){const c=$("#top");if(!c)return;const s=a==="like"?1:-1;c.style.transform=`translateX(${s*140}%) rotate(${s*20}deg)`;c.style.opacity=0;setTimeout(()=>act(a),240)}
let busy=false;
async function act(a){const p=Q[0];if(!p||busy)return;busy=true;
const {error}=await sb.from("likes").insert({from_id:user.id,to_id:p.id,kind:a==="skip"?"pass":a});busy=false;
if(error){const m=error.message||"";draw(1);if(m.includes("daily_limit")||m.includes("plus_required"))plus(m.includes("daily"));else toast("حصلت مشكلة، جرب تاني");return}
Q.shift();
if(a!=="skip"){const [x,y]=[user.id,p.id].sort();const {data}=await sb.from("matches").select("id").eq("user_a",x).eq("user_b",y).maybeSingle();if(data){draw(1);showMatch(p,data.id);fill();return}}
draw(1);fill()}
function showMatch(p,id){const m=$("#match");m.innerHTML=`<div class="pair">${av(p)}${av({id:user.id,name:me.name,photos:me.photos})}</div><h1>ماتش!</h1><p>أنت و${esc(p.name)} أعجبتوا ببعض</p><button class="btn ghost" style="max-width:280px" data-chat="${id}" data-nm="${esc(p.name)}" data-uid="${p.id}">ابعت رسالة</button><button class="lnk" style="color:#fff;margin-top:14px" data-a="closem">كمّل</button>`;m.hidden=false;hydrate()}

/* ---------- matches / chat ---------- */
async function loadM(){const {data,error}=await sb.rpc("get_my_matches");if(error){toast("شغّل ملف التحديث get_my_matches في Supabase");M=[]}else M=data||[];if(tab==="c")draw(1)}
function vC(){return `<div class="pad"><h2 class="t">الرسايل</h2>`+(M.length?M.map(p=>`<button class="row" data-chat="${p.match_id}" data-nm="${esc(p.name)}" data-uid="${p.user_id}">${av({id:p.user_id,name:p.name,photos:p.photos})}<div class="g"><b>${esc(p.name)}، ${p.age}</b><br><small>ابدأ المحادثة</small></div></button>`).join(""):`<div class="empty">${ic("chat")}<p>لسه مفيش ماتشات.<br>الماتش بيحصل لما الاتنين يعملوا إعجاب.</p></div>`)+`</div>`}
async function openC(id,nm,uid){cm={id,nm,uid};$("#match").hidden=true;const c=$("#chat");c.hidden=false;
c.innerHTML=`<div class="ch"><button data-a="cb" aria-label="رجوع" style="transform:scaleX(-1)">${ic("back")}</button><b style="flex:1">${esc(nm)}</b><button class="lnk" data-a="blk">حظر</button></div><div class="msgs" id="ms"><p class="empty">جاري التحميل…</p></div><form class="cf" id="cf"><input id="ci" maxlength="1000" placeholder="اكتب رسالة…" autocomplete="off" aria-label="رسالة"><button aria-label="إرسال">${ic("send")}</button></form>`;
const {data}=await sb.from("messages").select("*").eq("match_id",id).order("created_at");const ids=new Set();const ms=$("#ms");ms.innerHTML="";
const add=m=>{if(ids.has(m.id))return;ids.add(m.id);const d=document.createElement("div");d.className="m"+(m.sender_id===user.id?" me":"");d.textContent=m.body;const t=document.createElement("small");t.textContent=new Date(m.created_at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});d.append(t);ms.append(d);ms.scrollTop=ms.scrollHeight};
(data||[]).forEach(add);if(!data?.length)ms.innerHTML='<p class="empty">قول أهلاً 👋</p>';
if(chn)sb.removeChannel(chn);
chn=sb.channel("m"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`match_id=eq.${id}`},p=>{ms.querySelector(".empty")?.remove();add(p.new)}).subscribe();
$("#cf").onsubmit=async e=>{e.preventDefault();const v=$("#ci").value.trim();if(!v)return;$("#ci").value="";
const {data:r,error}=await sb.from("messages").insert({match_id:id,sender_id:user.id,body:v}).select().single();
if(error){toast("تعذر الإرسال");$("#ci").value=v;return}ms.querySelector(".empty")?.remove();add(r)}}
function closeC(){$("#chat").hidden=true;if(chn){sb.removeChannel(chn);chn=null}cm=null}

/* ---------- profile / dialogs ---------- */
function vP(){return `<div class="pad"><h2 class="t">أنا</h2><div class="panel" style="display:flex;gap:14px;align-items:center">${av({id:user.id,name:me.name,photos:me.photos})}<div><b style="font-size:18px">${esc(me.name)}</b><br><small style="color:var(--mut)">${esc(me.gov)} · ${INT[me.intent]}${me.is_verified?" · ✓ موثق":""}</small></div></div>
<div class="plus"><b style="font-size:20px">ونس بلس</b><p>إعجابات غير محدودة، سوبر لايك، ومعرفة مين أعجب بيك.</p><button data-a="plus">تفاصيل</button></div>
<div class="panel"><button class="row" style="margin:0" data-a="theme"><div class="g"><b>الوضع الليلي</b></div></button><button class="row" data-a="policy"><div class="g"><b>سياسة الخصوصية</b></div></button><button class="row" data-a="safe"><div class="g"><b>نصايح الأمان</b></div></button><button class="row" data-a="out"><div class="g"><b>تسجيل خروج</b></div></button><button class="row" data-a="del" style="color:var(--like)"><div class="g"><b>حذف حسابي نهائياً</b></div></button></div></div>`}
function plus(daily){open(`<h2>ونس بلس</h2>${daily?'<p style="color:var(--like);font-weight:700">خلصت إعجاباتك المجانية النهارده.</p>':""}<p style="font-size:26px;font-weight:800;margin:4px 0">49 جنيه / شهر</p><ul><li>إعجابات غير محدودة</li><li>سوبر لايك</li><li>تعرف مين أعجب بيك</li></ul><p style="color:var(--mut);font-size:14px">الاشتراك لسه مش متاح للدفع داخل التطبيق. الإعجابات المجانية بتتجدد كل يوم.</p><button class="btn" data-a="cl">تمام</button>`)}
const info=(t,l)=>open(`<h2>${t}</h2><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn" data-a="cl">تمام</button>`);
const policy=()=>info("سياسة الخصوصية",["بنخزّن: إيميلك واسمك وتاريخ ميلادك ومحافظتك وصورتك وإعجاباتك ورسايلك.","مش بنعرض إيميلك ولا تاريخ ميلادك لحد، بنعرض عمرك بس.","تقدر تحذف حسابك وكل بياناتك في أي وقت من صفحة أنا.","التطبيق لسن 18 سنة فأكتر.","مسودة تحتاج مراجعة قانونية قبل الإطلاق الرسمي (قانون حماية البيانات الشخصية رقم 151 لسنة 2020)."]);
const safe=()=>info("نصايح الأمان",["ما تبعتش فلوس لأي حد مهما كان السبب.","أول لقاء في مكان عام وعرّف حد قريب.","ما تشاركش عنوانك أو بياناتك المالية.","بلّغ عن أي حساب مريب."]);
function rep(){const p=Q[0];if(!p)return;open(`<h2>إبلاغ أو حظر ${esc(p.name)}</h2>${[["fake","صورة أو بيانات مش حقيقية"],["money","طلب فلوس"],["abuse","كلام مسيء"],["other","سبب تاني"]].map(([k,v],i)=>`<label class="ck"><input type="radio" name="r" value="${k}" ${i?"":"checked"}> ${v}</label>`).join("")}<button class="btn" data-block="${p.id}">إبلاغ وحظر</button><button class="btn ghost" data-blockonly="${p.id}">حظر فقط</button>`)}
async function doBlock(id,report){if(report){const r=dlg.querySelector("input:checked")?.value||"other";await sb.from("reports").insert({reporter_id:user.id,reported_id:id,reason:r})}
const {error}=await sb.from("blocks").insert({blocker_id:user.id,blocked_id:id});dlg.open&&dlg.close();if(error&&!error.message.includes("duplicate")){toast("تعذر الحظر");return}
Q=Q.filter(p=>p.id!==id);M=M.filter(p=>p.user_id!==id);toast("تم");draw(1);fill()}

function draw(keep){$$("nav button").forEach(b=>b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
const v=$("#view");v.className=keep?"":"anim";v.innerHTML=({d:vD,c:vC,p:vP})[tab]();bind();hydrate()}

document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.sel){const [k,v]=d.sel.split(":");sel[k]=v;chipsFor(k,k==="it"?INT:GEN);return}
if(d.tab){tab=d.tab;if(tab==="c")loadM();draw();return}
if(d.gov){gov=d.gov;Q=[];seenIds.clear();done=false;draw(1);fill();return}
if(d.chat){openC(d.chat,d.nm,d.uid);return}
if(d.block){doBlock(d.block,true);return}if(d.blockonly){doBlock(d.blockonly,false);return}
switch(d.a){case"like":case"skip":fly(d.a);break;case"super":act("super");break;case"rep":rep();break;case"plus":plus();break;
case"policy":policy();break;case"safe":safe();break;case"cl":dlg.close();break;case"closem":$("#match").hidden=true;break;
case"cb":closeC();loadM();break;
case"blk":if(cm&&confirm("حظر "+cm.nm+"؟ المحادثة هتتقفل.")){const u=cm.uid;closeC();doBlock(u,false)}break;
case"theme":{const dk=getComputedStyle(document.body).backgroundColor==="rgb(251, 247, 240)";document.documentElement.dataset.theme=dk?"dark":"light"}break;
case"out":await sb.auth.signOut();break;
case"del":if(confirm("هيتمسح حسابك وكل بياناتك نهائياً. متأكد؟")){const {error}=await sb.rpc("delete_my_account");if(error)toast("تعذر الحذف");else{await sb.auth.signOut();toast("تم حذف حسابك")}}break}});
route();
</script>
</body>
</html>
